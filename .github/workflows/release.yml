name: Release

# 用法一（推荐，无需本地操作）：GitHub → Actions → Release → Run workflow，填写版本号（如 1.0.1），在 main 上运行。
#   自动：改 versionName/versionCode → 测试并构建 APK → 提交到 main → 创建 tag 与 Release。
# 用法二：手动推送 v* tag（需与 app/build.gradle.kts 的 versionName 一致）。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "新版本号（主.次.修订，例如 1.0.1）"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "请在 main 分支上运行此工作流" >&2; exit 1; }
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "版本号格式应为 主.次.修订，当前: $VERSION" >&2
            exit 1
          fi
          # 版本号单调递增：1.2.3 -> 10203
          CODE=$(( ${BASH_REMATCH[1]} * 10000 + ${BASH_REMATCH[2]} * 100 + ${BASH_REMATCH[3]} ))
          {
            echo "version=$VERSION"
            echo "code=$CODE"
            echo "tag=v$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Bump version (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
            echo "tag ${{ steps.v.outputs.tag }} 已存在" >&2
            exit 1
          fi
          CURRENT=$(sed -nE 's/.*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts)
          if [ "${{ steps.v.outputs.code }}" -le "$CURRENT" ]; then
            echo "新的 versionCode(${{ steps.v.outputs.code }}) 必须大于当前的 $CURRENT" >&2
            exit 1
          fi
          sed -i -E \
            -e 's/versionCode = [0-9]+/versionCode = ${{ steps.v.outputs.code }}/' \
            -e 's/versionName = "[^"]*"/versionName = "${{ steps.v.outputs.version }}"/' \
            app/build.gradle.kts
          git diff --stat

      - name: Check tag matches versionName (tag push)
        if: github.event_name == 'push'
        run: |
          NAME=$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          if [ "$NAME" != "${{ steps.v.outputs.version }}" ]; then
            echo "tag ${{ steps.v.outputs.tag }} 与 app/build.gradle.kts 的 versionName ($NAME) 不一致" >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "autoclick-${{ steps.v.outputs.tag }}.apk"

      - name: Commit version bump (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "chore: release ${{ steps.v.outputs.tag }}"
          git push origin HEAD:main

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" "autoclick-${{ steps.v.outputs.tag }}.apk" \
            --target "$(git rev-parse HEAD)" \
            --title "${{ steps.v.outputs.tag }}" --generate-notes
