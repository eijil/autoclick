name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check tag matches versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          NAME=$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          if [ "v$NAME" != "${{ github.ref_name }}" ]; then
            echo "tag ${{ github.ref_name }} 与 app/build.gradle.kts 的 versionName ($NAME) 不一致" >&2
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk autoclick-${{ github.ref_name }}.apk

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "autoclick-${{ github.ref_name }}.apk" \
            --title "${{ github.ref_name }}" --generate-notes
